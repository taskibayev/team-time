services:
  - type: web
    name: team-time
    runtime: docker
    plan: free
    repo: https://github.com/taskibayev/team-time.git
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /timers
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: '0'
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
